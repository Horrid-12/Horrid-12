name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Custom Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Horrid-12
          outputs: |
            profile/github-contribution-snake.svg?color_snake=#F0544F&color_dots=#3A3335,#480A1E,#9C6A07,#F0544F,#C6D8D3

      - name: Commit Snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-contribution-snake.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push
