name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&ring_color=F0544F&bg_color=3A3335&title_color=F0544F&text_color=C6D8D3&icon_color=9C6A07&border_color=480A1E&card_width=380          
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
         card: top-langs
         options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&langs_color=F0544F,9C6A07,C6D8D3,F0544F,9C6A07,C6D8D3&bg_color=3A3335&title_color=F0544F&text_color=C6D8D3&border_color=480A1E&card_width=350
         path: profile/top-langs.svg
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
